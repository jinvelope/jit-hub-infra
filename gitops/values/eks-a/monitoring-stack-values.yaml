# gitops/values/eks-a/monitoring-stack-values.yaml
# EKS-A = 에이전트 (메트릭/로그를 온프레미스 중앙으로 전송)

kube-prometheus-stack:
  enabled: true

  prometheus:
    prometheusSpec:
      # 중앙 Prometheus 수신 시 클러스터 구분용 레이블
      externalLabels:
        cluster: eks-a
      # 온프레미스 중앙 Prometheus로 메트릭 전송 (Cloudflare Tunnel 경유) - 도메인 세팅 후 활성화
      # remoteWrite:
      #   - url: "https://prometheus-ingest.jit-hub-domain.com/api/v1/write"

  # 테스트용 임시 활성화 (운영 시 비활성 - 온프레 Grafana 통합 모니터링)
  grafana:
    enabled: true
    adminPassword: "admin"
    sidecar:
      datasources:
        defaultDatasourceEnabled: false
    additionalDataSources:
      - name: "EKS-A"
        type: prometheus
        uid: prometheus
        url: http://eks-a-monitoring-stack-kub-prometheus.monitoring:9090/
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s

  alertmanager:
    enabled: false

loki:
  enabled: false

promtail:
  enabled: true
  config:
    clients:
      # 온프레미스 중앙 Loki로 로그 전송 (Cloudflare Tunnel 경유) - 도메인 세팅 후 활성화
      - url: "http://localhost:3100/loki/api/v1/push"
        external_labels:
          cluster: eks-a
