# gitops/values/onprem/monitoring-stack-values.yaml
# 온프레미스 = 중앙 허브 (모든 클러스터의 메트릭/로그 수신)

kube-prometheus-stack:
  enabled: true

  prometheus:
    service:
      type: LoadBalancer
      port: 9090
      loadBalancerIP: 172.16.8.32
    prometheusSpec:
      externalLabels:
        cluster: onprem
      # 다른 클러스터에서 remote_write로 보내는 메트릭 수신
      enableRemoteWriteReceiver: true
      retention: 30d
      resources:
        requests:
          memory: 1Gi
          cpu: 500m
        limits:
          memory: 4Gi
          cpu: 2000m

  # 온프레미스에서만 Grafana 활성화 (통합 대시보드)
  grafana:
    enabled: true
    adminPassword: "admin"  # 운영 시 Secret으로 교체 필요
    service:
      type: LoadBalancer
      port: 80
      loadBalancerIP: 172.16.8.33
    sidecar:
      datasources:
        defaultDatasourceEnabled: false
    additionalDataSources:
      - name: "OnPrem"
        type: prometheus
        uid: prometheus
        url: http://onprem-monitoring-stack-ku-prometheus.monitoring:9090/
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s
      - name: "Loki"
        type: loki
        uid: loki
        url: http://onprem-monitoring-stack-loki:3100
        access: proxy
        isDefault: false

  alertmanager:
    enabled: true

loki:
  enabled: true
  deploymentMode: SingleBinary
  chunksCache:
    enabled: false      # ★ 추가 — Pending 제거
  resultsCache:
    enabled: false      # ★ 추가  
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      # existingClaim은 이 Loki 차트(6.6.2) singleBinary StatefulSet에서 실제로
      # 참조되지 않는다 (죽은 옵션). storageClass: "-"로 동적 프로비저닝을 끄고,
      # charts/monitoring-stack/templates/loki-pv.yaml의 claimRef로 NFS PV와 매칭시킨다.
      storageClass: "-"
  nfs:
    enabled: true
    server: "172.16.8.203"        # NFS 서버 IP (실제 IP로 변경 필요)
    path: "/nfs/shared/jithub-loki"   # NFS 경로
    storage: 50Gi

lokiLoadBalancer:
  enabled: true
  ip: 172.16.8.34

# 큐레이션된 로그 전용 NFS 볼륨. jithub-log-curator DaemonSet이 대상 서비스
# (auth/weather/traffic/tourist/gateway) 로그 중 filterPattern에 걸리는 줄만
# 여기에 append하고, promtail은 이 파일 하나만 tail한다.
# hostPath가 아니라 NFS라서 master/node1 어느 노드에서 로그가 나든 한 파일로 모인다.
curatedLogs:
  enabled: true
  nfs:
    server: "172.16.8.203"
    path: "/nfs/shared/jithub-curated"
    storage: 5Gi
  filterPattern: "ERROR|WARN|CRITICAL"
  targetApps: "auth,weather,traffic,tourist,gateway"

promtail:
  enabled: true
  config:
    clients:
      - url: http://onprem-monitoring-stack-loki:3100/loki/api/v1/push
        external_labels:
          cluster: onprem
    snippets:
      scrapeConfigs: |
        - job_name: jithub-curated
          static_configs:
            - targets:
                - localhost
              labels:
                job: jithub-curated
                __path__: /var/log/jithub-curated/*.log

  extraVolumes:
    - name: jithub-curated
      persistentVolumeClaim:
        claimName: jithub-curated-pvc

  extraVolumeMounts:
    - name: jithub-curated
      mountPath: /var/log/jithub-curated
      readOnly: true


# EKS 클러스터들의 remote_write/promtail을 받는 Ingress
ingestIngress:
  # MetalLB 직접 IP 방식(lokiLoadBalancer, kube-prometheus-stack.prometheus.service)으로
  # 전환하면서 더 이상 쓰이지 않음. ingress-nginx가 없는 클러스터에서는 이 Ingress가
  # ADDRESS를 못 받아 ArgoCD sync를 막으므로 비활성화.
  enabled: false
  domain: unzipp.cloud # 도메인
  prometheusServiceName: onprem-monitoring-stack-ku-prometheus
  lokiServiceName: onprem-monitoring-stack-loki
