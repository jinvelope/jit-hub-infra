apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: jithu-log-writer
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: jithu-log-writer
  template:
    metadata:
      labels:
        app: jithu-log-writer
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              i=1
              while [ $i -le 5 ]; do
                echo "$(date -Iseconds) [$(hostname)] sample log $i" >> /var/log/jithub/jithub_log.log
                i=$((i+1))
              done
              sleep 3600
          volumeMounts:
            - name: varlog
              mountPath: /var/log
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: DirectoryOrCreate