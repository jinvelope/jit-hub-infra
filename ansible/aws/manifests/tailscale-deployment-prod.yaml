# tailscale-deployment.yaml 파일
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailscale-router
  namespace: tailscale
spec:
  selector:
    matchLabels:
      app: tailscale
  template:
    metadata:
      labels:
        app: tailscale
    spec:
      serviceAccountName: tailscale-sa
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
      - name: tailscale
        image: tailscale/tailscale:latest
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        # NODE_NAME을 먼저 정의해야 아래에서 $(NODE_NAME) 치환됨
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: TS_STATE_DIR
          value: "/var/lib/tailscale"
        # 노드마다 고유 hostname
        - name: TS_HOSTNAME
          value: "prod-router-$(NODE_NAME)"
        - name: TS_EXTRA_ARGS
          value: "--advertise-tags=tag:prod-subnet-router --advertise-routes=10.0.0.0/16,172.20.0.0/16 --accept-routes"
        - name: TS_USERSPACE
          value: "false"

        securityContext:
          capabilities:
            add:
            - NET_ADMIN

        # postStart: tailscale0가 안 뜬 채로 종료되면 라우팅 설정이 조용히 누락되고
        # postStart 실패로 컨테이너가 재시작될 수 있어, 실패 시 exit 0으로 빠져나가되
        # readiness에서 재확인하도록 함 (아래 readinessProbe 참고)
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  for i in $(seq 1 60); do
                    ip link show tailscale0 >/dev/null 2>&1 && break
                    sleep 1
                  done
                  if ! ip link show tailscale0 >/dev/null 2>&1; then
                    echo "tailscale0 interface did not come up within 60s, skipping route setup (will retry via readiness)"
                    exit 0
                  fi
                  ip route replace 172.16.8.0/24 dev tailscale0
                  iptables -t nat -C POSTROUTING -d 172.16.8.0/24 -o tailscale0 -j MASQUERADE 2>/dev/null || \
                  iptables -t nat -A POSTROUTING -d 172.16.8.0/24 -o tailscale0 -j MASQUERADE

        # tailscale0 인터페이스 + 172.16.8.0/24 라우트가 실제로 잡혀있는지 계속 확인.
        # postStart가 타이밍상 실패했더라도 인터페이스가 늦게 뜨면 재시도해서 라우트를 잡음.
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                ip link show tailscale0 >/dev/null 2>&1 || exit 1
                ip route show 172.16.8.0/24 dev tailscale0 >/dev/null 2>&1 || \
                  ip route replace 172.16.8.0/24 dev tailscale0
                iptables -t nat -C POSTROUTING -d 172.16.8.0/24 -o tailscale0 -j MASQUERADE 2>/dev/null || \
                  iptables -t nat -A POSTROUTING -d 172.16.8.0/24 -o tailscale0 -j MASQUERADE
          initialDelaySeconds: 5
          periodSeconds: 15

        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        - name: tsstate
          mountPath: /var/lib/tailscale
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
      - name: tsstate
        hostPath:
          path: /var/lib/tailscale-router
          type: DirectoryOrCreate
